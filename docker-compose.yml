# Local development dependencies for DineFlow.
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres
    environment:
      POSTGRES_DB: dineflow
      POSTGRES_USER: dineflow
      POSTGRES_PASSWORD: dineflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineflow -d dineflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dineflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
