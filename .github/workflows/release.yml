name: Release images

# Builds the api and web images and pushes them to GitHub Container Registry, tagged with the
# release version and "latest". Tag a release with `git tag v1.0.0 && git push origin v1.0.0`,
# or run it by hand from the Actions tab. The server then runs `docker compose pull && docker compose up -d`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet test DineFlow/DineFlow.Test -c Release

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dineflow-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
