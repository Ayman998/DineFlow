name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Build the .NET projects only; the Angular esproj in the solution is covered by the web job.
      - run: dotnet build DineFlow -c Release
      - run: dotnet test tests/DineFlow.Tests -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build guest
      - run: npx ng build merchant
      - run: npx ng test guest --watch=false
      - run: npx ng test merchant --watch=false
