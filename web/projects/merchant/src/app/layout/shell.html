<div class="flex min-h-full">
  <aside class="w-60 shrink-0 border-e border-line bg-white print:hidden">
    <div class="px-5 py-5 text-lg font-bold text-brand">DineFlow</div>
    <nav class="flex flex-col gap-1 px-3">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="rounded-lg px-3 py-2 text-sm font-medium text-ink-muted hover:bg-surface aria-[current=page]:bg-brand/10 aria-[current=page]:text-brand">
          {{ item.title }}
        </a>
      }
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-between border-b border-line bg-white px-8 py-3 print:hidden">
      <div class="text-sm">
        <span class="font-semibold">{{ auth.profile()?.tenantName }}</span>
        @if (currentVenue.venue(); as venue) {
          <span class="text-ink-muted"> · {{ venue.name }}</span>
        }
      </div>
      <div class="flex items-center gap-4 text-sm">
        <span class="text-ink-muted">{{ auth.profile()?.displayName }} ({{ auth.profile()?.role }})</span>
        <button type="button" class="font-medium text-brand hover:underline" (click)="auth.logout()">Sign out</button>
      </div>
    </header>

    <main class="flex-1 bg-surface p-8 print:bg-white print:p-0">
      <router-outlet />
    </main>
  </div>
</div>
