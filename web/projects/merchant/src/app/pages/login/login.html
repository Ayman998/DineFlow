@let t = this.t();
<main class="flex min-h-full bg-white">
  <!-- Brand panel, from the helloZen brand board -->
  <section class="relative hidden w-[46%] max-w-[640px] flex-col justify-between overflow-hidden bg-ink p-12 text-white lg:flex">
    <hz-logo class="relative z-10 self-start text-[34px]" [tagline]="true" />

    <div class="relative z-10">
      <h2 class="max-w-md text-[34px] leading-tight font-bold">@for (part of t.pitch; track $index) {<span [class.text-accent]="$index % 2 === 1">{{ part }}</span>}</h2>
      <ul class="mt-10 grid max-w-md grid-cols-4 gap-4">
        @for (pillar of pillars; track pillar.key) {
          <li class="flex flex-col items-center gap-2.5 text-center">
            <span class="flex size-12 items-center justify-center rounded-2xl border border-white/10 bg-white/5 text-accent">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path [attr.d]="pillar.icon" />
              </svg>
            </span>
            <span class="text-xs font-semibold text-white/80">{{ t.pillars[pillar.key] }}</span>
          </li>
        }
      </ul>
    </div>

    <svg class="pointer-events-none absolute -end-10 top-0 h-full w-2/3 text-accent/15" viewBox="0 0 300 600" preserveAspectRatio="none" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M300 40C200 90 260 200 170 260S120 420 300 470M300 60C210 110 270 215 185 272S140 425 300 490M300 80C220 130 280 230 200 284S160 430 300 510M300 100C230 150 290 245 215 296S180 435 300 530M300 120C240 170 300 260 230 308S200 440 300 550" />
    </svg>
  </section>

  <div class="relative flex flex-1 items-center justify-center px-6 py-16">
    <button type="button" class="absolute end-6 top-6 rounded-full border border-line px-3 py-1 text-sm font-medium hover:border-ink/30 hover:bg-surface"
            [attr.aria-label]="i18n.t().changeLanguage" [attr.lang]="i18n.lang() === 'en' ? 'ar' : 'en'" (click)="i18n.toggle()">{{ i18n.t().otherLanguage }}</button>
    <form
      class="w-full max-w-sm"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate>
      <div class="mb-8">
        <hz-logo tone="light" class="mb-10 text-[26px] lg:hidden" />
        <h1 class="text-[28px] font-bold">{{ t.signIn }}</h1>
        <p class="mt-1.5 text-ink-muted">{{ t.intro }}</p>
      </div>

      <label class="mb-4 block">
        <span class="field-label">{{ t.email }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          class="field h-11 text-base" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="mt-1 block text-sm text-red-700">{{ t.emailInvalid }}</span>
        }
      </label>

      <label class="mb-6 block">
        <span class="field-label">{{ t.password }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="field h-11 text-base" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="mt-1 block text-sm text-red-700">{{ t.passwordRequired }}</span>
        }
      </label>

      @if (error()) {
        <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ error() }}</p>
      }

      <button
        type="submit"
        class="btn-primary w-full py-3 text-base"
        [disabled]="busy()">
        {{ busy() ? t.signingIn : t.signIn }}
      </button>
    </form>
  </div>
</main>
