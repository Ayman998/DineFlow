<main class="flex min-h-full items-center justify-center bg-surface px-4">
  <form
    class="w-full max-w-sm rounded-2xl border border-line bg-white p-8 shadow-sm"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate>
    <div class="mb-6">
      <div class="text-xl font-bold text-brand">DineFlow</div>
      <h1 class="mt-4 text-2xl font-bold">Sign in</h1>
      <p class="mt-1 text-sm text-ink-muted">Manage your venue, tables and QR codes.</p>
    </div>

    <label class="mb-4 block">
      <span class="mb-1 block text-sm font-medium">Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        class="w-full rounded-lg border border-line px-3 py-2.5 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="mt-1 block text-sm text-red-700">Enter a valid email address.</span>
      }
    </label>

    <label class="mb-6 block">
      <span class="mb-1 block text-sm font-medium">Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-lg border border-line px-3 py-2.5 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="mt-1 block text-sm text-red-700">Enter your password.</span>
      }
    </label>

    @if (error()) {
      <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      class="w-full rounded-lg bg-brand py-2.5 font-semibold text-white hover:bg-brand-dark disabled:opacity-60"
      [disabled]="busy()">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
