@let t = i18n.t();

<div class="relative flex min-h-dvh flex-col overflow-hidden bg-ink text-white">
  <header class="relative z-10 flex justify-end px-5 pt-5">
    <button
      type="button"
      class="inline-flex min-h-11 items-center rounded-full border-[1.5px] border-white/30 px-3.5 text-sm font-semibold"
      [attr.aria-label]="t.changeLanguage"
      (click)="i18n.toggle()">
      {{ t.otherLanguage }}
    </button>
  </header>

  <main class="relative z-10 flex flex-1 flex-col items-center justify-center px-8 text-center">
    <hz-logo class="text-[44px]" [stacked]="true" [tagline]="true" />
    <h1 class="mt-14 text-2xl font-bold">{{ t.homeTitle }}</h1>
    <p class="mt-2 text-white/70">{{ t.homeBody }}</p>
  </main>

  <ul class="relative z-10 mx-5 grid grid-cols-4 divide-x divide-white/10 rounded-2xl border border-white/10 bg-ink/80 py-4 backdrop-blur-sm">
    @for (pillar of pillars; track pillar.key) {
      <li class="flex flex-col items-center gap-2 px-1 text-center">
        <svg class="size-7 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="pillar.icon" />
        </svg>
        <span class="text-xs font-semibold text-white/85">{{ t.pillars[pillar.key] }}</span>
      </li>
    }
  </ul>

  <p class="relative z-10 mx-auto mt-4 mb-6 inline-flex items-center gap-2 rounded-full bg-white/5 px-3 py-1 text-xs text-white/60">
    <span class="size-2 rounded-full" [class]="apiOnline() ? 'bg-emerald-400' : 'bg-accent'"></span>
    {{ t.api }}: {{ apiOnline() ? t.online : t.offline }}
  </p>

  <!-- The flowing lines from the brand board. -->
  <svg class="pointer-events-none absolute inset-x-0 bottom-0 h-64 w-full text-accent/20" viewBox="0 0 400 256" preserveAspectRatio="none" fill="none" stroke="currentColor" aria-hidden="true">
    <path d="M-10 120C80 70 150 190 240 140S360 80 410 110M-10 136C80 86 150 206 240 156S360 96 410 126M-10 152C80 102 150 222 240 172S360 112 410 142M-10 168C80 118 150 238 240 188S360 128 410 158M-10 184C80 134 150 254 240 204S360 144 410 174M-10 200C80 150 150 270 240 220S360 160 410 190M-10 216C80 166 150 286 240 236S360 176 410 206" />
  </svg>
</div>
